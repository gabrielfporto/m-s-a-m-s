name: Gerar IPA para Sideloadly
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Imagem macOS de compilação
        type: choice
        default: macos-latest
        options:
          - macos-latest
          - xcode-27
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Conferir Xcode e SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Testar origem da ponte e política de lembretes
        run: |
          swiftc MesAMes/DevicePolicy.swift tests/native-policy/main.swift -o /tmp/mesames-native-tests
          /tmp/mesames-native-tests
      - name: Compilar executável e empacotar IPA sem assinatura
        run: bash build-unsigned-ipa.sh
      - name: Disponibilizar IPA
        uses: actions/upload-artifact@v4
        with:
          name: MesAMes-unsigned-IPA
          path: build/MesAMes-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
